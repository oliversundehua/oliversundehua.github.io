<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV — Dehua (Oliver) Sun</title>
  <meta name="description" content="CV — Dehua (Oliver) Sun" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&display=swap" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #e8e6de;
      --text:   #1c1c1c;
      --serif:  'Cormorant Garamond', Georgia, serif;
      --gutter: 4vw;
      --max:    1500px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .site-wrapper {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 2.5rem;
      padding: 1.5vw 0;
      flex-wrap: wrap;
    }

    /* Synced with teaching page */
    .site-title {
      font-size: clamp(2.2rem, 3vw, 3rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .site-title a { color: inherit; text-decoration: none; }

    nav { display: flex; gap: 2rem; align-items: baseline; }

    nav a {
      font-size: clamp(1.5rem, 2.2vw, 2.2rem);
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
    }
    nav a[aria-current="page"] {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Main ── */
    main { padding: 2vw 0 6vw; }

    .pdf-link {
      font-size: clamp(1.3rem, 1.9vw, 1.6rem);
      font-weight: 500;
      line-height: 1.4;
    }

    .pdf-link a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .pdf-wrapper { margin-top: 1.5rem; }

    iframe {
      width: 100%;
      height: 90vh;
      border: none;
      display: block;
      -webkit-overflow-scrolling: touch;
    }

    /* Tablet: Google Docs viewer avoids iOS Safari's gray-margin PDF iframe */
    @media (max-width: 1024px) {
      .pdf-wrapper {
        margin-left: calc(-1 * var(--gutter));
        margin-right: calc(-1 * var(--gutter));
        width: calc(100% + 2 * var(--gutter));
        height: 85vh;
        overflow: hidden;
      }

      iframe { width: 100%; height: 100%; }
      iframe.native-pdf { display: none; }
      iframe.gdocs-pdf  { display: block; }
    }

    @media (min-width: 1025px) {
      iframe.gdocs-pdf  { display: none; }
      iframe.native-pdf { display: block; }
    }

    /* Small phones: hide iframe, show download link instead */
    @media (max-width: 600px) {
      .pdf-wrapper { display: none; }
      .pdf-mobile-note {
        display: block;
        margin-top: 1rem;
        font-size: clamp(1.1rem, 4vw, 1.5rem);
        font-weight: 500;
        color: var(--text);
      }
    }

    .pdf-mobile-note { display: none; }
  </style>
</head>

<body>
  <div class="site-wrapper">

    <header>
      <div class="site-title"><a href="/">Dehua (Oliver) Sun</a></div>
      <nav>
        <a href="/cv/" aria-current="page">CV</a>
        <a href="/research/">Research</a>
        <a href="/teaching/">Teaching</a>
      </nav>
    </header>

    <main>
      <!-- Update the href below if your CV filename changes -->
      <p class="pdf-link"><a href="/SunDehua_CV.pdf">CV [PDF]</a></p>
      <span class="pdf-mobile-note">→ <a href="/SunDehua_CV.pdf">Open CV (PDF)</a></span>
      <div class="pdf-wrapper">
        <!-- Desktop: native browser PDF viewer -->
        <iframe class="native-pdf" src="/SunDehua_CV.pdf" title="Curriculum Vitae"></iframe>
        <!-- Tablet: Google Docs viewer avoids iOS Safari's gray-margin PDF rendering -->
        <iframe class="gdocs-pdf" src="https://docs.google.com/viewer?url=https://oliversundehua.com/SunDehua_CV.pdf&embedded=true" title="Curriculum Vitae"></iframe>
      </div>
    </main>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV — Dehua (Oliver) Sun</title>
  <meta name="description" content="CV — Dehua (Oliver) Sun" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&display=swap" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #e8e6de;
      --text:   #1c1c1c;
      --serif:  'Cormorant Garamond', Georgia, serif;
      --gutter: 4vw;
      --max:    1500px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .site-wrapper {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 2.5rem;
      padding: 1.5vw 0;
      flex-wrap: wrap;
    }

    .site-title {
      font-size: clamp(1.9rem, 2.5vw, 2.5rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .site-title a { color: inherit; text-decoration: none; }

    nav { display: flex; gap: 2rem; align-items: baseline; }

    nav a {
      font-size: clamp(1.2rem, 1.7vw, 1.7rem);
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
    }
    nav a[aria-current="page"] {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Main ── */
    main { padding: 2vw 0 6vw; }

    iframe {
      width: 100%;
      height: 90vh;
      border: none;
      display: block;
      margin-top: 1.5rem;
    }

    main p {
      font-size: clamp(1.5rem, 2vw, 2rem);
      font-weight: 500;
      line-height: 1.4;
    }

    main a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>

<body>
  <div class="site-wrapper">

    <header>
      <div class="site-title"><a href="/">Dehua (Oliver) Sun</a></div>
      <nav>
        <a href="/cv/" aria-current="page">CV</a>
        <a href="/research/">Research</a>
        <a href="/teaching/">Teaching</a>
      </nav>
    </header>

    <main>
      <!-- Update the href below if your CV filename changes -->
      <p><a href="/SunDehua_CV.pdf">Curriculum Vitae (PDF)</a></p>
      <iframe src="/SunDehua_CV.pdf" width="100%" height="900"></iframe>
    </main>

  </div>
</body>
</html>
